name: greenbasket
description: A Flutter app connecting farmers and buyers.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.0.0
  flutter_hooks: ^0.21.3+1
  google_fonts: ^6.0.0
  cached_network_image: ^3.4.0
  image_picker: ^1.0.7
  shared_preferences: ^2.5.4
  intl: ^0.19.0

  # You can uncomment later if needed:
  # http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk value

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:  # you can enable later if needed
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/YourFont.ttf
